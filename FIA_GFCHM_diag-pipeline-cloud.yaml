    name: AthensDemo.GB_est
    inputs: []
    args:
      EVAL_GRP: "512021"
      ATTRIBUTE_NBR: 10
      GRP_BY_ATTRIB: STATECD, COUNTYCD
  - id: 019f9feb-311b-7000-a641-41268f4bac6d
    name: AthensDemo.reformat_fia
    inputs:
      - block: 019f9feb-311b-7000-a641-3971920ab6e9
