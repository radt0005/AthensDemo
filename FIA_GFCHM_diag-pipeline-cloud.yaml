      - 019f9feb-311b-7000-a641-631d6927603d
    args:
      strict: false
  - id: 019f9feb-311b-7000-a641-77f9c9bccf1b
    name: AthensDemo.fia_gfchm_diagnostics
    inputs:
      - block: 019f9feb-311b-7000-a641-6f366b70dbdb
