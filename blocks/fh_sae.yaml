id: AthensDemo.fh_sae
version: 0.1.1
kind: standard
network: false

description: >
  Fits an area-level Fay-Herriot small area model (via sae::mseFH()) to
  produce county EBLUPs and their RMSEs from FIA direct estimates/
  variances plus GFCHM canopy-height-bin predictors (e.g. the HT* bins
  glmnet_var_select identifies as stable). Counties with unreliably few
  FIA field plots (fia_plot_count_col <= min_plot_count) are dropped
  before fitting. Produces a combined results table (FIA direct stats +
  FH EBLUP/RMSE + standard-error-ratio) as CSV, and a diagnostic PDF
  with model summary, SER precision summary, and EBLUP-vs-direct /
  RMSE%-vs-SE% scatterplots.

entrypoint: fh_sae

inputs:
  joined_data:
    type: file
    format: Parquet
    description: Combined FIA estimates + GFCHM height-bin parquet table (e.g. output of base.reduce_stack in Join_FIA_GFCHM-pipeline.yaml).
  response:
    type: string
    description: Column name in joined_data holding the FIA direct estimate (e.g. ESTIMATE).
  variance:
    type: string
    description: Column name in joined_data holding the FIA direct estimate's variance (e.g. VARIANCE).
  predictors:
    type: string
    description: Comma-separated predictor column names for the Fay-Herriot model (e.g. HT20,HT25,HT30,HT35). Review glmnet_var_select's diagnostic PDF before setting this -- it is not wired to glmnet's output automatically.
  id_cols:
    type: string
    description: Comma-separated identifier/context columns from joined_data to carry through into the results table (e.g. STATECD,UNITCD,UNITNM,COUNTYCD,CO_FIPS,COUNTY_NAME).
  fia_se_col:
    type: string
    description: Column name in joined_data holding the FIA direct estimate's standard error (e.g. SE).
  fia_plot_count_col:
    type: string
    description: Column name in joined_data holding the FIA plot count per county (e.g. PLOT_COUNT).
  fia_nonzero_plot_col:
    type: string
    description: Column name in joined_data holding the FIA nonzero-plot count per county (e.g. NON_ZERO_PLOTS -- not currently selected by reformat_fia.R; add it there first if you want this populated).
  min_plot_count:
    type: number
    description: Minimum FIA plot count required for a county to be included in the Fay-Herriot fit. Counties with fia_plot_count_col <= this value (or missing/NA) are dropped before fitting. Default 1 (drops counties with 0 or 1 plots, i.e. unreliable direct estimates). Use the same value here and in glmnet_var_select's min_plot_count so both steps train/fit on the same county set.
  intercept:
    type: string
    description: >
      Whether to include a free intercept in the Fay-Herriot formula
      ("TRUE" or "FALSE"). Default "TRUE" for backward compatibility,
      but review glmnet_var_select's intercept diagnostic (page 2 of
      its diagnostic PDF) before relying on that default -- if it
      recommends intercept = FALSE (e.g. the zero-canopy/zero-volume
      physical justification holds and adding an intercept doesn't
      meaningfully improve CV-MSE), set this to "FALSE" to fit the
      matching zero-intercept Fay-Herriot model here.
  method:
    type: string
    description: Variance-component estimation method passed to sae::mseFH() (REML, ML, or FH).

outputs:
  result:
    type: file
    format: PDF
    description: >
      Diagnostic report: Fay-Herriot model summary, SER (standard error
      ratio) precision summary with best/worst-county preview tables,
      EBLUP-vs-FIA-direct-estimate scatterplot, and RMSE%-vs-SE%
      (both standardized by the FH EBLUP) scatterplot.
  table:
    type: file
    format: CSV
    description: >
      Full per-county results table: FIA direct stats (estimate, SE,
      SE%, plot count, nonzero plot count), FH EBLUP and RMSE, percent
      precision columns standardized by the FH EBLUP, and the SER
      (standard error ratio) column.
